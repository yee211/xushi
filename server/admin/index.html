<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>序时 · 管理后台</title><link rel="stylesheet" href="/admin/static/admin.css"></head>
<body>
  <div class="ambient"><i></i><i></i><i></i></div>
  <main id="loginView" class="login-shell"><form id="loginForm" class="glass login-card"><div class="logo">序</div><p class="eyebrow">XUSHI CONSOLE</p><h1>管理后台</h1><p class="muted">反馈处理与系统运行状态</p><label>管理员账号<input id="username" autocomplete="username" required></label><label>密码<input id="password" type="password" autocomplete="current-password" required></label><p id="loginError" class="error"></p><button class="primary" type="submit">安全登录</button></form></main>
  <div id="appView" class="app hidden"><aside class="glass sidebar"><div class="brand"><span class="logo small">序</span><div><b>序时</b><small>管理后台</small></div></div><nav><button class="nav active" data-page="overview">概览</button><button class="nav" data-page="feedback">用户反馈</button><button class="nav" data-page="traffic">流量监控</button><button class="nav" data-page="llm">大模型配置</button><button class="nav" data-page="admins">管理员</button></nav><button id="logout" class="logout">退出登录</button></aside><main class="content"><header><div><p class="eyebrow">OPERATIONS</p><h1 id="pageTitle">运行概览</h1></div><button id="refresh" class="ghost">刷新数据</button></header><section id="overviewPage" class="page"></section><section id="feedbackPage" class="page hidden"><div class="glass toolbar"><input id="feedbackSearch" placeholder="搜索编号、描述或邮箱"><select id="feedbackStatus"><option value="">全部状态</option><option value="pending">待处理</option><option value="processing">处理中</option><option value="resolved">已解决</option><option value="closed">已关闭</option></select><select id="feedbackCategory"><option value="">全部类型</option><option value="import">课表导入</option><option value="schedule">课程显示</option><option value="adjustment">调课</option><option value="agent">课表助手</option><option value="other">其他</option></select></div><div id="feedbackList" class="feedback-grid"></div></section><section id="trafficPage" class="page hidden"></section><section id="llmPage" class="page hidden"><div id="llmConfigList" class="llm-grid"></div></section><section id="adminsPage" class="page hidden"><div class="glass toolbar" style="display:flex;justify-content:space-between;align-items:center;"><span class="meta">系统管理员账号与权限管理</span><button id="openAddAdmin" type="button" class="save" style="margin:0;width:auto;padding:10px 20px;">+ 添加管理员</button></div><div id="adminsList" class="admins-grid" style="margin-top:16px;"></div></section></main></div>
  <dialog id="feedbackDialog"><form method="dialog" class="dialog-card"><button class="dialog-close" value="cancel">×</button><div id="feedbackDetail"></div></form></dialog><dialog id="adminDialog"><form id="addAdminForm" class="dialog-card"><button class="dialog-close" type="button" onclick="$('adminDialog').close()">×</button><p class="eyebrow">ADMIN MANAGEMENT</p><h2>添加管理员</h2><label>登录账号 (3~30字符，字母/数字/下划线)<input id="newAdminUser" required pattern="[a-zA-Z0-9_-]{3,30}" placeholder="例如 op_alice"></label><label>初始密码 (至少 8 位)<input id="newAdminPass" type="password" required minlength="8" placeholder="强密码"></label><label>角色权限<select id="newAdminRole"><option value="admin">普通管理员 (admin)</option><option value="superadmin">超级管理员 (superadmin)</option></select></label><p id="addAdminError" class="error"></p><button class="primary" type="submit" style="margin-top:20px;">确认创建</button></form></dialog><div id="toast" class="toast"></div><script src="/admin/static/admin.js" defer></script>
</body></html>
