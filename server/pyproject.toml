[project]
name = "xushi-server"
version = "3.0.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = [
    "B008",
    "B904",
    "B905",
    "E501",
    "BLE001",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
