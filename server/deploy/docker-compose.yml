name: xushi

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: xushi_schedule
      POSTGRES_USER: xushi
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请通过环境变量注入数据库密码}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xushi -d xushi_schedule"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 数据库和持久配置备份：成功后每 24 小时，失败 5 分钟后重试；保留 14 天
  db-backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_PASSWORD:?请通过环境变量注入数据库密码}
      PGCONNECT_TIMEOUT: "15"
    volumes:
      - ./backups:/backups
      - ../../data:/source-data:ro
      - ./backup.sh:/scripts/backup.sh:ro
      - ./verify-backup.sh:/scripts/verify-backup.sh:ro
    command: ["/bin/sh", "/scripts/backup.sh"]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 统一 API：网页端 SPA + Android 更新 + 微信小程序，同域同库
  api:
    build:
      context: ../..
      dockerfile: server/deploy/Dockerfile
      args:
        INSTALL_ACADEMIC_BROWSER: ${INSTALL_ACADEMIC_BROWSER:-false}
    restart: unless-stopped
    environment:
      APP_ENV: production
      PGHOST: db
      PGPORT: "5432"
      PGUSER: xushi
      PGDATABASE: xushi_schedule
      PGPASSWORD: ${DB_PASSWORD:?请通过环境变量注入数据库密码}
      # 网页端鉴权
      JWT_SECRET: ${JWT_SECRET:?请配置至少32字符随机密钥}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-10080}
      TRUST_PROXY_HEADERS: "true"
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-127.0.0.1/32,::1/128,172.30.240.1/32}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost,http://localhost,capacitor://localhost}
      # 演示账号（接管无主数据）
      DEFAULT_USERNAME: ${DEFAULT_USERNAME:-demo}
      DEFAULT_EMAIL: ${DEFAULT_EMAIL:-demo@example.com}
      DEFAULT_PASSWORD: ${DEFAULT_PASSWORD:?生产环境必须设置 DEFAULT_PASSWORD}
      # 小程序鉴权
      WECHAT_APP_ID: ${WECHAT_APP_ID:?请配置小程序 AppID}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:?请配置小程序 AppSecret}
      SESSION_DAYS: "30"
      # 上传与解析
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-75}
      AI_MAX_INPUT_CHARS: ${AI_MAX_INPUT_CHARS:-60000}
      VISION_BASE_URL: ${VISION_BASE_URL:-}
      VISION_API_KEY: ${VISION_API_KEY:-}
      VISION_MODEL: ${VISION_MODEL:-}
      VISION_TIMEOUT_SECONDS: ${VISION_TIMEOUT_SECONDS:-45}
      VISION_MAX_OUTPUT_TOKENS: ${VISION_MAX_OUTPUT_TOKENS:-2000}
      VISION_ENABLE_THINKING: ${VISION_ENABLE_THINKING:-false}
      # Agent 渠道
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
      ACADEMIC_CREDENTIAL_SECRET: ${ACADEMIC_CREDENTIAL_SECRET:-}
      ACADEMIC_DIRECTORY_WORKER_ENABLED: ${ACADEMIC_DIRECTORY_WORKER_ENABLED:-true}
      ACADEMIC_SYNC_WORKER_ENABLED: ${ACADEMIC_SYNC_WORKER_ENABLED:-true}
      BINDING_CODE_TTL_SECONDS: ${BINDING_CODE_TTL_SECONDS:-300}
      AGENT_BASE_URL: ${AGENT_BASE_URL:-}
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-15}
      AGENT_CHANNEL_PROVIDER: ${AGENT_CHANNEL_PROVIDER:-weixin_ilink}
      AGENT_REDIS_URL: redis://redis:6379/0
      AGENT_CONTEXT_TTL_SECONDS: ${AGENT_CONTEXT_TTL_SECONDS:-86400}
      DB_POOL_MIN_SIZE: ${DB_POOL_MIN_SIZE:-4}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-30}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-15.0}
      WEIXIN_ILINK_CREDENTIAL_KEY: ${WEIXIN_ILINK_CREDENTIAL_KEY:?请配置32字节Base64凭证加密密钥}
      WEIXIN_ILINK_CHANNEL_VERSION: ${WEIXIN_ILINK_CHANNEL_VERSION:-2.4.8}
      WEIXIN_ILINK_APP_ID: ${WEIXIN_ILINK_APP_ID:-bot}
      WEIXIN_ILINK_BOT_AGENT: ${WEIXIN_ILINK_BOT_AGENT:-XuShiSchedule/1.0.0}
      WEIXIN_ILINK_ROUTE_TAG: ${WEIXIN_ILINK_ROUTE_TAG:-}
      FEEDBACK_ANON_SALT: ${FEEDBACK_ANON_SALT:-}
      # 管理后台
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请配置管理后台密码}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?请配置管理后台会话密钥}
      ADMIN_SESSION_SECONDS: ${ADMIN_SESSION_SECONDS:-28800}
      LLM_ALLOWED_BASE_URLS: ${LLM_ALLOWED_BASE_URLS:-}
      LLM_CONFIG_ENCRYPTION_KEY: ${LLM_CONFIG_ENCRYPTION_KEY:-}
      # 推送与天气
      WEATHER_LATITUDE: ${WEATHER_LATITUDE:-}
      WEATHER_LONGITUDE: ${WEATHER_LONGITUDE:-}
      WEATHER_CACHE_MINUTES: ${WEATHER_CACHE_MINUTES:-60}
      MORNING_PUSH_TIME: ${MORNING_PUSH_TIME:-07:30}
      MORNING_PUSH_ENABLED: ${MORNING_PUSH_ENABLED:-true}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # 仅绑定回环，由外层 Nginx 统一对外；网页端与小程序 API 可共用同一域名
      - "127.0.0.1:8010:8000"
    volumes:
      # APK 与版本元数据持久挂载；网页产物随镜像发布，宿主机热更需启用 override
      - ../../static:/app/static
      - ../../data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/live', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # 普通微信 ClawBot 长轮询 Worker：必须与 Uvicorn 分离，保持单副本运行
  weixin-worker:
    build:
      context: ../..
      dockerfile: server/deploy/Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "app.channels.weixin", "worker"]
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: xushi
      PGDATABASE: xushi_schedule
      PGPASSWORD: ${DB_PASSWORD:?请通过环境变量注入数据库密码}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
      AGENT_BASE_URL: ${AGENT_BASE_URL:-}
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-15}
      AGENT_REDIS_URL: redis://redis:6379/0
      AGENT_CONTEXT_TTL_SECONDS: ${AGENT_CONTEXT_TTL_SECONDS:-86400}
      DB_POOL_MIN_SIZE: ${DB_POOL_MIN_SIZE:-4}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-30}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-15.0}
      WEIXIN_WORKER_CONCURRENCY: ${WEIXIN_WORKER_CONCURRENCY:-16}
      WEIXIN_ILINK_POLL_TIMEOUT_SECONDS: ${WEIXIN_ILINK_POLL_TIMEOUT_SECONDS:-2.0}
      WEIXIN_ILINK_CREDENTIAL_KEY: ${WEIXIN_ILINK_CREDENTIAL_KEY:?请配置32字节Base64凭证加密密钥}
      WEIXIN_ILINK_CHANNEL_VERSION: ${WEIXIN_ILINK_CHANNEL_VERSION:-2.4.8}
      WEIXIN_ILINK_APP_ID: ${WEIXIN_ILINK_APP_ID:-bot}
      WEIXIN_ILINK_BOT_AGENT: ${WEIXIN_ILINK_BOT_AGENT:-XuShiSchedule/1.0.0}
      WEIXIN_ILINK_ROUTE_TAG: ${WEIXIN_ILINK_ROUTE_TAG:-}
      LLM_ALLOWED_BASE_URLS: ${LLM_ALLOWED_BASE_URLS:-}
      LLM_CONFIG_ENCRYPTION_KEY: ${LLM_CONFIG_ENCRYPTION_KEY:-}
      WEATHER_LATITUDE: ${WEATHER_LATITUDE:-}
      WEATHER_LONGITUDE: ${WEATHER_LONGITUDE:-}
      WEATHER_CACHE_MINUTES: ${WEATHER_CACHE_MINUTES:-60}
      MORNING_PUSH_TIME: ${MORNING_PUSH_TIME:-07:30}
      MORNING_PUSH_ENABLED: ${MORNING_PUSH_ENABLED:-true}
      MORNING_PUSH_RETRY_WINDOW_MINUTES: ${MORNING_PUSH_RETRY_WINDOW_MINUTES:-180}
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # agent 在 worker 进程内直接查询教务；admin 面板写入的教务连接配置(data/academic)必须与 api 共享
      - ../../data:/app/data

volumes:
  pgdata:
  redisdata:

# The host Nginx reaches the published API port through this explicit bridge gateway.
# Override subnet/gateway/trusted proxies together if this range conflicts locally.
networks:
  default:
    ipam:
      config:
        - subnet: ${XUSHI_DOCKER_SUBNET:-172.30.240.0/24}
          gateway: ${XUSHI_DOCKER_GATEWAY:-172.30.240.1}
