name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install openpyxl beautifulsoup4
      - name: Ruff lint
        run: ruff check app tests scripts migrations
      - name: Unit tests
        run: pytest tests/ --tb=short
        env:
          APP_ENV: test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  miniapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: JS syntax check
        run: |
          node --check app.js
          node --check pages/index/index.js
          node --check pages/editor/editor.js
        working-directory: miniapp
      - name: WXML tag balance & binding check
        run: node scripts/check_wxml.js
        working-directory: miniapp
